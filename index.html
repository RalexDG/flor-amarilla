<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#241a48">
  <title>Una flor para ti</title>
  <meta name="description" content="Una flor amarilla que viajó desde Panamá hasta México, solo para ti.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Una flor para ti 🌻">
  <meta property="og:description" content="Viajó desde Panamá hasta México, solo para ti.">
  <meta property="og:image" content="https://ralexdg.github.io/flor-amarilla/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/great-vibes.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="stage" id="stage">

  <!-- Fondo: atardecer -->
  <div class="scene" aria-hidden="true">
    <div class="sky"></div>
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <svg class="hills hills-far" viewBox="0 0 1440 300" preserveAspectRatio="none">
      <path d="M0,150 C180,90 340,130 540,120 S900,70 1120,115 S1360,120 1440,95 V300 H0Z" fill="#a24a72"/>
    </svg>
    <svg class="hills hills-mid" viewBox="0 0 1440 300" preserveAspectRatio="none">
      <path d="M0,120 C220,70 420,140 690,105 S1150,60 1440,120 V300 H0Z" fill="#6b3266"/>
    </svg>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>

  <main class="content">
    <header class="phrase">
      <h1>Flores amarillas para mi amorshito en México</h1>
      <p class="love">te amo siempre</p>
    </header>

    <div class="flower-wrap">
      <svg id="flower" viewBox="0 0 400 640" preserveAspectRatio="xMidYMax meet" role="img"
           aria-label="Una flor amarilla que se mece suavemente"></svg>
    </div>

    <svg class="hills hills-near" viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="nearG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a1d46"/>
          <stop offset="1" stop-color="#1f1030"/>
        </linearGradient>
      </defs>
      <path d="M0,95 C240,45 470,105 720,80 S1180,40 1440,90 V300 H0Z" fill="url(#nearG)"/>
    </svg>

    <footer class="sign">
      <p class="from">de tu amosito Sr. De Gracia</p>
      <!-- <p class="since">desde el 7 de agosto de 2025</p> -->
      <div class="timer" role="timer" aria-label="">
        <div class="cell"><span class="num" id="t-y">0</span><span class="lbl" id="l-y">años</span></div>
        <div class="cell"><span class="num" id="t-mo">0</span><span class="lbl" id="l-mo">meses</span></div>
        <div class="cell"><span class="num" id="t-d">0</span><span class="lbl" id="l-d">días</span></div>
        <div class="cell"><span class="num" id="t-h">00</span><span class="lbl">horas</span></div>
        <div class="cell"><span class="num" id="t-mi">00</span><span class="lbl">min</span></div>
        <div class="cell"><span class="num" id="t-s">00</span><span class="lbl">seg</span></div>
      </div>
    </footer>
  </main>

  <button id="sound" class="sound" type="button" aria-label="Silenciar sonido" aria-pressed="true" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor" stroke="none"/>
      <path class="wave" d="M15.5 9a4 4 0 0 1 0 6"/>
      <path class="wave" d="M18 6.5a7.5 7.5 0 0 1 0 11"/>
      <path class="cross" d="M16 9.5l5 5M21 9.5l-5 5"/>
    </svg>
  </button>
</div>

<!-- Pantalla de bienvenida -->
<div id="intro" class="intro">
  <div class="intro-inner">
    <svg class="route" viewBox="0 0 320 200" aria-hidden="true">
      <defs>
        <radialGradient id="orbG">
          <stop offset="0" stop-color="#fff8d6"/>
          <stop offset=".35" stop-color="#ffd56a" stop-opacity=".9"/>
          <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <path class="route-ghost" d="M262,158 C250,58 150,18 52,52"/>
      <path class="route-progress" pathLength="1" d="M262,158 C250,58 150,18 52,52"/>
      <circle class="dot dot-pa" cx="262" cy="158" r="4.5"/>
      <circle class="dot dot-mx" cx="52" cy="52" r="4.5"/>
      <text class="place" x="262" y="182" text-anchor="middle">Panamá</text>
      <text class="place" x="52" y="36" text-anchor="middle">México</text>
      <g style="opacity:0">
        <circle r="16" fill="url(#orbG)"/>
        <circle r="3.4" fill="#fffbe6"/>
        <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.4s" fill="freeze"/>
        <animateMotion dur="3.2s" begin="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1"
                       keySplines=".45 0 .2 1" path="M262,158 C250,58 150,18 52,52"/>
      </g>
    </svg>

    <p class="intro-line">Una flor viajó desde Panamá hasta ti</p>
    <button id="open" class="open-btn" type="button">Abrir</button>
    <p class="intro-hint">con un suave sonido ambiente ♪</p>
  </div>
</div>

<script src="js/audio.js" defer></script>
<script src="js/flower.js" defer></script>
<script src="js/fx.js" defer></script>
<script src="js/main.js" defer></script>
</body>
</html>
